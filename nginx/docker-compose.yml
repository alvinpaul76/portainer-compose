networks:
  shared-network:
    name: ${SHARED_DOCKER_NETWORK:?set SHARED_DOCKER_NETWORK in .env}
    external: true
  # Private link between nginx and Portainer; Portainer is not reachable from shared-network.
  portainer_internal:
    internal: true

volumes:
  portainer_data:
    driver: local
    driver_opts:
      type: none
      device: ${DEFAULT_STORAGE_FOLDER:?set DEFAULT_STORAGE_FOLDER in .env}/data
      o: bind

services:
  portainer:
    image: portainer/portainer-ce:${PORTAINER_VERSION:-2.45.3}
    container_name: portainer
    command: ["--http-enabled"]   # HTTP is off by default; nginx proxies to :9000 over the private network
    networks:
      - portainer_internal
    restart: unless-stopped
    # No published ports: access goes through nginx. To use the Edge tunnel, also add
    # "8000:8000" here and attach an outward-facing network.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # Docker socket
      - portainer_data:/data                        # Persistent Portainer data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 200
    # No healthcheck: the Portainer image is scratch-based (no shell, wget or curl).

  nginx-proxy:
    image: nginx:1.31.3-alpine
    container_name: portainer-nginx
    networks:
      - portainer_internal
      - shared-network
    restart: unless-stopped
    ports:
      # Only needed for host-level access; cloudflared on shared-network can reach portainer-nginx:80 directly.
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - portainer
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
