networks:
  shared-network:
    name: ${SHARED_DOCKER_NETWORK}
    external: true

volumes:
  portainer_data:
    driver: local
    driver_opts:
      type: none
      device: /storage/portainer/data
      o: bind

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    networks:
      - shared-network
    restart: always
    ports:
      - "${PORTAINER_PORT}:9000"   # Portainer web UI
      - "${PORTAINER_EDGE_TUNNEL_PORT}:8000"   # Edge tunnel
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # Docker socket
      - portainer_data:/data                        # Persistent Portainer data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx-proxy:
    image: nginx:alpine
    container_name: portainer-nginx
    networks:
      - shared-network
    restart: always
    ports:
      - "8080:80"  # Expose on port 8080 for Cloudflare tunnel
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - portainer
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - /run
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
