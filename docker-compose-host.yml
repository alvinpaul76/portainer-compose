networks:
  shared-network:
    name: ${SHARED_DOCKER_NETWORK}
    external: true

volumes:
  portainer_data:
    driver: local
    driver_opts:
      type: none
      device: ${DEFAULT_STORAGE_FOLDER}/data
      o: bind

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    networks:
      - shared-network
    restart: always
    ports:
      - "127.0.0.1:${PORTAINER_PORT}:9000"      # Portainer web UI (HTTP)
      - "127.0.0.1:${PORTAINER_HTTPS_PORT}:9443" # Portainer web UI (HTTPS)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # Docker socket
      - portainer_data:/data                        # Persistent Portainer data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
