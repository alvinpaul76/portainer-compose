networks:
  shared-network:
    name: ${SHARED_DOCKER_NETWORK}
    external: true
  agent_network:
    driver: bridge

volumes:
  portainer_data:
    driver: local
    driver_opts:
      type: none
      device: ${DEFAULT_STORAGE_FOLDER}/data
      o: bind
  agent_data:

services:
  agent:
    image: portainer/agent:latest
    container_name: portainer-agent
    restart: always
    ports:
      - "127.0.0.1:${PORTAINER_AGENT_PORT}:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - agent_data:/data
    environment:
      - EDGE=1
      - EDGE_ID=${PORTAINER_EDGE_ID}
      - EDGE_KEY=${PORTAINER_EDGE_KEY}
      - EDGE_INSECURE_POLL=${PORTAINER_EDGE_INSECURE_POLL}
      - LOG_LEVEL=${PORTAINER_LOG_LEVEL}
      - AGENT_CLUSTER_ADDR=portainer-agent
    networks:
      - agent_network
      - shared-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9001"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
