networks:
  shared-network:
    name: ${SHARED_DOCKER_NETWORK:?set SHARED_DOCKER_NETWORK in .env}
    external: true

volumes:
  agent_data:
    driver: local
    driver_opts:
      type: none
      device: ${DEFAULT_STORAGE_FOLDER:?set DEFAULT_STORAGE_FOLDER in .env}/agent_data
      o: bind

services:
  agent:
    image: portainer/agent:${PORTAINER_VERSION:-2.45.3}
    container_name: portainer-agent
    restart: unless-stopped
    # Edge mode polls the Portainer server outbound, so no inbound port is published.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - agent_data:/data
    environment:
      - EDGE=1
      - EDGE_ID=${PORTAINER_EDGE_ID:?set PORTAINER_EDGE_ID in .env}
      - EDGE_KEY=${PORTAINER_EDGE_KEY:?set PORTAINER_EDGE_KEY in .env}
      - EDGE_INSECURE_POLL=${PORTAINER_EDGE_INSECURE_POLL:-0}
      - LOG_LEVEL=${PORTAINER_LOG_LEVEL:-INFO}
      - AGENT_CLUSTER_ADDR=${AGENT_CLUSTER_ADDR:?set AGENT_CLUSTER_ADDR in .env}
    networks:
      - shared-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.5
    pids_limit: 100
    # No healthcheck: the agent image has no shell, wget or curl.
