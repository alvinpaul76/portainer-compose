networks:
  shared-network:
    name: ${SHARED_DOCKER_NETWORK:?set SHARED_DOCKER_NETWORK in .env}
    external: true

volumes:
  portainer_data:
    driver: local
    driver_opts:
      type: none
      device: ${DEFAULT_STORAGE_FOLDER:?set DEFAULT_STORAGE_FOLDER in .env}/data
      o: bind

services:
  portainer:
    image: portainer/portainer-ce:${PORTAINER_VERSION:-2.45.3}
    container_name: portainer
    networks:
      - shared-network
    restart: unless-stopped
    ports:
      # HTTP (9000) is disabled by default in current Portainer releases; use HTTPS.
      - "127.0.0.1:${PORTAINER_HTTPS_PORT:-9443}:9443" # Portainer web UI (HTTPS)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # Docker socket
      - portainer_data:/data                        # Persistent Portainer data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 200
    # No healthcheck: the Portainer image is scratch-based (no shell, wget or curl),
    # so any CMD-based check would always report "unhealthy".
